<style>
  :root{
    --ink:#1C1638; --deep:#251E4A; --card:#2F2660; --edge:#463A85;
    --gold:#FFC94A; --aqua:#4ADEC0; --rose:#FF7A9C;
    --text:#F5F1FF; --muted:#A79FCB;
    --display:"Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
  #app{max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 120px}
  h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font:inherit;color:var(--text);background:var(--deep);border:1.5px solid var(--edge);
    border-radius:14px;padding:12px;width:100%;font-family:var(--body)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
  .mut{color:var(--muted)}

  .bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .stat{display:flex;align-items:center;gap:6px;background:var(--deep);border:1px solid var(--edge);
    border-radius:999px;padding:6px 13px 6px 10px;font-weight:600;font-size:15px}
  .stat b{font-family:var(--display);font-size:17px}
  .ring{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
  .ring i{background:var(--ink);width:35px;height:35px;border-radius:50%;display:grid;place-items:center;
    font-style:normal;font-size:11.5px;font-weight:700;font-family:var(--display)}

  .hero{background:linear-gradient(150deg,var(--card),var(--deep));border:1px solid var(--edge);
    border-radius:26px;padding:20px;margin-bottom:20px}
  .hero h1{font-size:23px;line-height:1.15;margin-bottom:6px}
  .hero p{margin:0;color:var(--muted);font-size:14.5px}
  .go{display:block;width:100%;margin-top:14px;background:var(--gold);color:#241C05;font-family:var(--display);
    font-weight:700;font-size:17px;padding:15px;border-radius:16px;box-shadow:0 4px 0 #C99A24}
  .go:active{transform:translateY(3px);box-shadow:0 1px 0 #C99A24}
  .go.ghost{background:transparent;color:var(--text);border:1.5px solid var(--edge);box-shadow:none}
  .go.ghost:active{transform:none}
  .go[disabled]{opacity:.4;box-shadow:none}

  .sec{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--gold);margin:24px 0 6px}
  .unit{display:flex;align-items:center;gap:14px;width:100%;padding:7px 0;text-align:left}
  .unit:nth-child(even){padding-left:28px}
  .node{position:relative;flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--edge)}
  .node svg{width:28px;height:28px}
  .node .fill{position:absolute;inset:-5px;border-radius:50%;z-index:-1}
  .unit .meta strong{display:block;font-family:var(--display);font-size:16px}
  .unit .meta span{font-size:13px;color:var(--muted)}
  .unit.done .node{background:var(--aqua);color:#0C2A25}

  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(28,22,56,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom);z-index:20}
  .tabs button{flex:1;padding:11px 4px 13px;font-size:11px;font-weight:600;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-selected="true"]{color:var(--gold)}

  .lessonbar{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .track{flex:1;height:12px;background:var(--deep);border-radius:99px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--aqua);border-radius:99px;transition:width .35s}
  .quit{font-size:21px;color:var(--muted);line-height:1;padding:4px 6px}
  .hearts{font-size:15px;letter-spacing:1px}

  .ask{font-size:15px;color:var(--muted);margin-bottom:12px}
  .stage{position:relative;background:#000;border:1px solid var(--edge);border-radius:20px;overflow:hidden;margin-bottom:16px}
  .stage video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#000}
  .replay{position:absolute;right:10px;bottom:10px;background:rgba(28,22,56,.82);border:1px solid var(--edge);
    border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600}
  .warn{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;
    font-size:13.5px;color:var(--muted);background:#120E26}
  .stage.failed .warn{display:grid}
  .tap{position:absolute;inset:0;display:none;place-items:center;background:rgba(18,14,38,.5);
    font-family:var(--display);font-weight:700;font-size:17px}
  .stage.paused .tap{display:grid}
  .stage.paused .replay{display:none}
  .word{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1;margin:2px 0 14px}

  .opts{display:grid;gap:10px}
  .opt{background:var(--card);border:1.5px solid var(--edge);border-radius:16px;padding:15px;text-align:left;
    font-size:16.5px;font-weight:500}
  .grid{grid-template-columns:1fr 1fr}
  .grid .opt{padding:0;overflow:hidden;border-radius:18px}
  .grid video{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#000}
  .opt.right{border-color:var(--aqua);background:#1E4A44}
  .opt.wrong{border-color:var(--rose);background:#4A2333}
  .opt[disabled]{opacity:.55}
  .opt.right[disabled],.opt.wrong[disabled]{opacity:1}
  .rate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .rate button{border:1.5px solid var(--edge);border-radius:15px;padding:13px 4px;font-weight:600;font-size:14px}
  .rate .again{border-color:#7A4560;color:var(--rose)}
  .rate .easy{border-color:#2F6B60;color:var(--aqua)}

  .foot-fixed{position:sticky;bottom:72px;padding:14px 0 6px;
    background:linear-gradient(180deg,transparent,var(--ink) 22%);margin-top:18px}
  .verdict{border-radius:18px;padding:14px 16px;margin-bottom:10px;font-weight:600}
  .verdict.ok{background:#1E4A44;color:var(--aqua)}
  .verdict.no{background:#4A2333;color:var(--rose)}
  .verdict small{display:block;font-weight:400;color:var(--text);opacity:.85;font-size:13.5px;margin-top:3px}

  .panel{background:var(--deep);border:1px solid var(--edge);border-radius:20px;padding:16px;margin-top:16px}
  .panel h3{font-size:15px;margin-bottom:5px}
  .panel p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
  .switch{display:flex;gap:8px;flex-wrap:wrap}
  .switch button{flex:1 1 30%;border:1.5px solid var(--edge);border-radius:13px;padding:10px 4px;font-size:14px;font-weight:600}
  .switch button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:#332A5E}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;
    border-bottom:1px solid var(--edge)}
  .row strong{font-weight:600;font-size:16px}
  .row .pill{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--edge);
    border-radius:99px;padding:3px 9px;white-space:nowrap}
  .bars{display:flex;gap:4px;margin-top:10px}
  .bars i{flex:1;height:34px;background:var(--card);border-radius:5px;position:relative}
  .bars i b{position:absolute;left:0;right:0;bottom:0;background:var(--gold);border-radius:5px;display:block}
  .end{text-align:center;padding-top:24px}
  .end .big{font-family:var(--display);font-size:54px;font-weight:700;color:var(--gold);line-height:1}
  .foot{margin-top:22px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.7}
  .foot a{color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------- lessons ---------------- */
function start(uid, m, reviewOnly){
  unitNow = uid ? UMAP[uid] : null;
  var pool = unitNow ? unitNow.words : WORDLIST;
  var fresh = [], revs = [], i, w;
  for(i=0;i<pool.length;i++){
    w = pool[i];
    if(!S.cards[w]){ if(!reviewOnly) fresh.push(w); }
    else if(S.cards[w].due <= dayNum()) revs.push(w);
  }
  shuffle(revs); shuffle(fresh);
  if(reviewOnly && !revs.length){
    for(w in S.cards) if(W[w] && S.cards[w].box <= 3) revs.push(w);
    revs.sort(function(a,b){ return S.cards[a].box - S.cards[b].box; });
    revs = revs.slice(0, 10);
  }
  var learn = fresh.slice(0, revs.length >= 8 ? 2 : 4);
  var rev = revs.slice(0, 10 - learn.length * 2);
  var pairs = [], loose = [];
  learn.forEach(function(x){ pairs.push([{w:x, kind:"learn"}, {w:x, kind:"pick"}]); });
  rev.forEach(function(x){ loose.push({w:x, kind:kindFor(m)}); });
  if(!pairs.length && !loose.length){
    var all = pool.filter(function(x){ return S.cards[x]; })
      .sort(function(a,b){ return S.cards[a].box - S.cards[b].box; });
    loose = all.slice(0,8).map(function(x){ return {w:x, kind:kindFor(m)}; });
    if(!loose.length) loose = shuffle(pool.slice()).slice(0,6).map(function(x){ return {w:x, kind:"learn"}; });
  }
  queue = []; requeued = {};
  shuffle(pairs).forEach(function(p){ queue.push(p[0], p[1]); });
  queue = queue.concat(shuffle(loose));
  qi = 0; gained = 0; hearts = 5; right = 0; requeued = {};
  if(queue.length) step(); else render();
}
function kindFor(m){
  if(m === "prod") return "produce";
  if(m === "recog") return Math.random() < .35 ? "grid" : "pick";
  var r = Math.random();
  return r < .3 ? "produce" : r < .55 ? "grid" : "pick";
}
function others(w, n){
  var u = UMAP[UNIT_OF[w]];
  var p = (u ? u.words : WORDLIST).filter(function(x){ return x !== w; });
  if(p.length < n) p = p.concat(WORDLIST.filter(function(x){ return x !== w; }));
  return shuffle(p).slice(0, n);
}
function shell(inner, foot){
  screen = "lesson";
  app.innerHTML = '<div class="lessonbar"><button class="quit" id="quit" aria-label="Close">✕</button>'
    + '<div class="track"><i style="width:' + (qi/queue.length*100) + '%"></i></div>'
    + '<div class="hearts">' + Array(hearts+1).join("♥")
    + '<span style="opacity:.25">' + Array(6-hearts).join("♥") + '</span></div></div>'
    + inner + '<div class="foot-fixed" id="foot">' + (foot||"") + '</div>';
  document.getElementById("quit").onclick = function(){ save(); render(); };
}
function stage(w){
  return '<div class="stage">' + media(w) + '<div class="warn"></div>'
    + '<button class="tap" id="tap">▶  Tap to play</button>'
    + '<button class="replay" id="rep">Replay</button></div>';
}
function wireStage(){
  var r = document.getElementById("rep");
  if(r) r.onclick = function(){ var v = app.querySelector(".stage video"); if(v){ v.currentTime = 0; v.play(); } };
  var t = document.getElementById("tap");
  if(t) t.onclick = function(){
    var st = t.parentNode, v = st.querySelector("video");
    v.play().then(function(){ st.classList.remove("paused"); }, function(){});
  };
  armVideos();
}
function step(){
  answered = false;
  if(qi >= queue.length) return finish();
  var it = queue[qi];
  if(it.kind === "learn") exLearn(it.w);
  else if(it.kind === "grid") exGrid(it.w);
  else if(it.kind === "produce") exProduce(it.w);
  else exPick(it.w);
}

function exProduce(w){

  document.getElementById("show").onclick = function(){

      + '<button class="easy" data-g="2">Spot on</button></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".rate button"), function(b){
      b.onclick = function(){ grade(w, +b.getAttribute("data-g")); }; });
  };
}
/* a missed sign comes back, but only twice, so a bad round still ends */
function canRequeue(w){
  requeued[w] = (requeued[w] || 0) + 1;
  return requeued[w] <= 2 && queue.length < 24;
}
function bindOpts(w){
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
    b.onclick = function(){ answer(b, b.getAttribute("data-w") === w, w); }; });
}
function answer(btn, ok, w){
  if(answered) return; answered = true;
  btn.classList.add(ok ? "right" : "wrong");
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(x){
    x.disabled = true;
    if(!ok && x.getAttribute("data-w") === w) x.classList.add("right"); });
  if(ok){ right++; } else hearts--;
  bump(w, ok ? 1 : 0);
  if(!ok && canRequeue(w)) queue.push({w:w, kind:"pick"});
  var v = variant(w);
  document.getElementById("foot").innerHTML =
    '<div class="verdict ' + (ok?"ok":"no") + '">' + (ok ? "Correct" : "It was: " + esc(w))
    + (!ok && v.d ? '<small>' + esc(v.d) + '</small>' : "") + '</div>'
    + '<button class="go" id="next">Continue</button>';
  document.getElementById("next").onclick = function(){
    if(hearts <= 0) return dead();
    qi++; step();
  };
}
function grade(w, g){
  bump(w, g);
  if(g === 0){ if(canRequeue(w)) queue.push({w:w, kind:"produce"}); } else right++;
  qi++; step();
}
function bump(w, g){
  var c = S.cards[w] || {box:0};
  c.box = g === 0 ? 1 : Math.min(7, c.box + (g === 2 ? 2 : 1));
  c.due = dayNum() + [1,1,2,4,8,16,32,60][c.box];
  S.cards[w] = c;
  award(g === 0 ? 2 : g === 2 ? 12 : 10);
  save();
}
function award(n){
  gained += n; S.xp += n; S.todayXp += n;
  S.days[dayNum()] = (S.days[dayNum()] || 0) + n;
}
function dead(){
  screen = "end"; save();
  app.innerHTML = '<div class="end"><div class="big">♥</div>'
    + '<h2 style="font-size:22px;margin:12px 0 6px">Out of hearts</h2>'
    + '<p class="mut">You kept ' + gained + ' XP. Hearts refill every round.</p>'
    + '<button class="go" id="again" style="margin-top:20px">Try again</button>'
    + '<button class="go ghost" id="back">Back</button></div>' + tabbar();
  wireEnd();
}
function finish(){
  screen = "end";
  var t = dayNum();
  if(S.lastNum !== t){ S.streak = (S.lastNum === t-1) ? S.streak + 1 : 1; S.lastNum = t; }
  award(20); save();
  app.innerHTML = '<div class="end"><div class="big">+' + gained + '</div>'
    + '<h2 style="font-size:22px;margin:10px 0 6px">' + (S.todayXp >= S.goal ? "Daily goal reached" : "Round complete") + '</h2>'
    + '<p class="mut" style="margin:0 0 4px">🔥 ' + S.streak + ' day streak · ' + right + '/' + queue.length + ' first time right</p>'
    + '<p class="mut" style="font-size:14px">' + learnedCount() + ' signs learned all up.</p>'
    + '<button class="go" id="again" style="margin-top:20px">Another round</button>'
    + '<button class="go ghost" id="back">Back</button></div>' + tabbar();
  wireEnd();
}
function wireEnd(){
  document.getElementById("again").onclick = function(){ start(unitNow ? unitNow.id : null, mode); };
  document.getElementById("back").onclick = render;
  Array.prototype.forEach.call(app.querySelectorAll("[data-tab]"), function(b){
    b.onclick = function(){ tab = b.getAttribute("data-tab"); render(); }; });
}
boot();
</script>
