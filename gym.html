<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one-column phone app. Sticky header with an 8-week plate-colour bar, scrolling content, fixed bottom tabs, full-screen exercise sheet. Max 560px wide. */
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --surface-2:#F4F5F3; --ink:#14171A; --muted:#59626A; --line:#D2D7D7;
  --accent:#D3361C; --accent-ink:#FFFFFF; --accent-soft:#FBE3DC;
  --far:#A6AEB3; --equip:#BCC3C6; --equip-soft:#E2E6E6; --metal:#7A848A; --plate:#2B3034;
  --ok:#1C8449; --ok-soft:#DCF0E3;
  --p-green:#2E9D5A; --p-yellow:#E0AC1F; --p-white:#C2C8CB; --p-blue:#2A62D6; --p-red:#D3361C;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#181B1E; --surface-2:#1E2226; --ink:#E8EBEA; --muted:#98A1A7; --line:#2B3135;
  --accent:#FF5B40; --accent-ink:#1C0904; --accent-soft:#3A1C15;
  --far:#5C656B; --equip:#40484D; --equip-soft:#262B2F; --metal:#8F999F; --plate:#5D666D;
  --ok:#47C27B; --ok-soft:#153222; --p-white:#E3E7E8; --p-red:#FF5B40; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#181B1E; --surface-2:#1E2226; --ink:#E8EBEA; --muted:#98A1A7; --line:#2B3135;
  --accent:#FF5B40; --accent-ink:#1C0904; --accent-soft:#3A1C15;
  --far:#5C656B; --equip:#40484D; --equip-soft:#262B2F; --metal:#8F999F; --plate:#5D666D;
  --ok:#47C27B; --ok-soft:#153222; --p-white:#E3E7E8; --p-red:#FF5B40; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px 9px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent);font-weight:800}
.wk{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar8{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding-block:0 9px}
.bar8 i{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar8 i span{position:absolute;inset:0;width:var(--w,0%);background:var(--c)}

main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:6px}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Type */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
h1.display{font-size:clamp(34px,10vw,46px)}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:28px 0 10px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.dchip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dchip .c{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em}
.dchip .n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.dchip.sel{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dchip.sel .n{color:inherit;opacity:.75}
.dchip.done .c::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:3px;vertical-align:3px}
.dchip.today:not(.sel){border-color:var(--accent)}

/* Hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.hero .sub{color:var(--muted);font-size:14.5px}
.platechip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.plate{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 4px rgba(0,0,0,.14);flex:none;position:relative}
.plate::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.effort{font-size:14px;border-top:1px dashed var(--line);padding-top:10px}

.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:14px}

/* Exercise list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.exrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;width:100%}
.exrow:last-child{border-bottom:0}
.exno{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.exrow.complete .exno{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.exname{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.expr{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.exlast{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.chev{color:var(--muted);font-size:18px}
.warm{font-size:13.5px;color:var(--muted);margin:14px 2px 8px}

.done-banner{background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.done-banner strong{font-family:var(--f-display);text-transform:uppercase;font-size:20px;letter-spacing:.03em}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .22s ease}
.sheet.open{transform:none;opacity:1}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[disabled]{opacity:.35}
.sheet-title{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.sheet-body{padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}

.stage{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:200/140;max-width:100%}
.stage-ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.stage-ctl button{min-height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700}
.stage-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage-note{position:absolute;left:10px;top:11px;font-size:11.5px;color:var(--muted);font-weight:600;max-width:50%}

.fig .fn{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .ff{stroke:var(--far);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .ft{stroke:var(--ink);stroke-width:8.5;fill:none;stroke-linecap:round}
.fig .fneck{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fig .fh{fill:var(--ink)}
.fig .fbody{fill:var(--ink);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.fig .eq{fill:var(--equip)}
.fig .eqsoft{fill:var(--equip-soft);stroke:var(--equip);stroke-width:1}
.fig .eqbox{fill:var(--equip-soft);stroke:var(--equip);stroke-width:1.5}
.fig .eqs{stroke:var(--equip);stroke-width:3;fill:none;stroke-linecap:round}
.fig .eqpad{stroke:var(--equip);stroke-width:7;fill:none;stroke-linecap:round}
.fig .eqbelt{stroke:var(--equip);stroke-width:6;fill:none;stroke-linecap:round}
.fig .eqring{stroke:var(--equip);stroke-width:3;fill:none}
.fig .eqm{stroke:var(--metal);stroke-width:1.4;fill:none}
.fig .eqbar{stroke:var(--metal);stroke-width:3;fill:none;stroke-linecap:round}
.fig .eqp{fill:var(--plate)}
.fig .hub{fill:var(--metal)}
.fig .fl{stroke:var(--line);stroke-width:2}

.ex-h{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,40px);text-transform:uppercase;line-height:.95;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.logbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.target{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.target .big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase}
.tip{font-size:13.5px;margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--surface-2)}
.tip.up{background:var(--ok-soft)}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sethead,.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.sethead.one,.setrow.one{grid-template-columns:28px minmax(0,1fr) 52px}
.sethead.none,.setrow.none{grid-template-columns:28px minmax(0,1fr) 52px}
.sethead{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.setno{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.setrow input{width:100%;min-width:0;height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.setrow input::placeholder{color:var(--muted);opacity:.7}
.setrow .lbl{font-size:13.5px;color:var(--muted)}
.tick{height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tick svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .tick{background:var(--ok);border-color:var(--ok)}
.setrow.done .tick svg{stroke:var(--surface)}
.setrow.done input{border-color:var(--ok)}
.setctl{display:flex;gap:8px;margin-top:10px}

.howto{margin-top:22px}
.howto h3{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px}
.howto ol,.howto ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.howto li{padding-left:2px}
.howto ol li::marker{font-family:var(--f-display);font-weight:800}
.swap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.yt{margin-top:14px}
.yt svg{width:20px;height:20px;fill:currentColor}

/* Rest timer */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:70;width:min(528px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rest .rl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.rest .rt{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:62px}
.rest .sp{flex:1}
.rest button{min-height:38px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(127,127,127,.45);background:transparent;color:inherit;font-weight:700;font-size:13px}
.rest .rb{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:var(--p,100%)}
.rest.go{background:var(--ok);color:var(--surface)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

/* Plan */
.phases{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.phase{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .plate{width:24px;height:24px;margin-top:2px}
.phase .plate::after{inset:8px}
.phase h3{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.phase .mono{font-size:12px;color:var(--muted)}
.phase.cur{background:var(--surface-2)}
.grid8{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.grid8 .gh{font-family:var(--f-display);font-weight:800;font-size:13px;text-align:center;color:var(--muted);letter-spacing:.04em}
.grid8 .wl{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.grid8 .wl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11.5px;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.cell.done{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.cell.today{border-color:var(--accent);border-width:2.5px;font-weight:700}
.cell.missed{opacity:.55;border-style:dashed}
.cell.future{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.legend i.done{background:var(--ok);border-color:var(--ok)}
.legend i.today{border-color:var(--accent);border-width:2px}
.daylist{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.daylist div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.daylist div:last-child{border-bottom:0}
.daylist b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:.04em}

/* Moves */
.search{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px 8px 8px;width:100%}
.mrow:last-child{border-bottom:0}
.thumb{width:76px;height:auto;aspect-ratio:200/140;border-radius:9px;background:var(--surface-2);display:block}
.mrow .exname{font-size:15px}
.mrow .exlast{font-size:12.5px}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select{height:46px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:16px;font-family:var(--f-mono);width:100%;min-width:0}
.chart{margin-top:12px}
.chart h4{margin:0 0 4px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.chart h4 span{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.end{fill:var(--accent)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift .exname{font-size:14.5px}
.spark{width:92px;height:30px}
.spark .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.spark .pt{fill:var(--accent)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border-bottom:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Guide */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.g summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";font-family:var(--f-mono);font-size:20px;color:var(--muted)}
details.g[open] summary::after{content:"–"}
details.g .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;max-width:65ch}
details.g ul,details.g ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.os{font-weight:700;margin-top:4px}
.sync{display:flex;align-items:center;gap:8px;font-size:13.5px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync i.on{background:var(--ok)}
.danger{border-color:var(--accent);color:var(--accent)}

@media (prefers-reduced-motion: reduce){ .sheet{transition:none} }

.restore{width:100%;min-height:84px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);padding:10px;font-family:var(--f-mono);font-size:16px;resize:vertical}
</style>
</head>
<body><div id="app">
  <header class="top">
    <div class="wrap">
      <div class="brand">Glute <b>Plan</b></div>
      <div class="wk" id="wk"></div>
    </div>
    <div class="wrap"><div class="bar8" id="bar8"></div></div>
  </header>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabs" aria-label="Sections">
    <div class="wrap">
      <button class="tab" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14.5l2 2 4-4"/></svg>Today</button>

const LEN = {torso:34, upper:16, fore:15, thigh:24, shin:23, foot:9};

function ik(root, target, a, b, bend){
  const dx=target[0]-root[0], dy=target[1]-root[1];

  const c=(a*a+d*d-b*b)/(2*a*d);

  const j=add(root, dir(base-bend*al), a);
  const e=add(j, dir(Math.atan2(target[1]-j[1], target[0]-j[0])/RAD), b);

function figure(p, ex){

  const sh1=front?[S[0]-11,S[1]]:S, sh2=front?[S[0]+11,S[1]]:S;
  const hp1=front?[H[0]-7,H[1]]:H, hp2=front?[H[0]+7,H[1]]:H;
  const kb1=p.kb1==null?1:p.kb1, kb2=p.kb2==null?kb1:p.kb2;
  const A1=p.A1, A2=p.A2||p.A1;
  let K1,An1,K2,An2;
  if(p.K1){ K1=p.K1; An1=A1; K2=p.K2||p.K1; An2=A2; }
  else { [K1,An1]=ik(hp1,A1,L.thigh,L.shin,kb1); [K2,An2]=ik(hp2,A2,L.thigh,L.shin,kb2); }

function lerpV(a,b,k){

}
function lerpPose(A,B,k){ const o={}; for(const key of new Set([...Object.keys(A),...Object.keys(B)])){ o[key] = !(key in A) ? B[key] : !(key in B) ? A[key] : lerpV(A[key],B[key],k); } return o; }
const frameOf = (ex,i) => Object.assign({}, ex.base, ex.frames[i]);
const ease = k => 0.5-0.5*Math.cos(Math.PI*Math.min(1,Math.max(0,k)));
function cyclePose(ex, phase){

  } else if(c.type==='bike'){
    const pd1=[c.cx+c.r*Math.cos(ph), c.cy+c.r*Math.sin(ph)], pd2=[c.cx-c.r*Math.cos(ph), c.cy-c.r*Math.sin(ph)];
    p.Pd1=pd1; p.Pd2=pd2; p.A1=[pd1[0]-2,pd1[1]-3]; p.A2=[pd2[0]-2,pd2[1]-3];

}
function timeline(ex){

  const segs=[]; let T=0;

}
function poseAt(ex, tl, time){
  if(tl.cycle) return cyclePose(ex, (time % tl.T)/tl.T);

  const s=tl.segs.find(s=>tau>=s.start && tau<s.start+s.h+s.d) || tl.segs[0];
  const loc=tau-s.start, k = loc<s.h ? 0 : ease((loc-s.h)/s.d);
  return lerpPose(frameOf(ex,s.from), frameOf(ex,s.to), k);
}
const staticPose = ex => ex.cycle ? cyclePose(ex, 0.12) : frameOf(ex, ex.thumb==null ? 1 : ex.thumb);

</script>

<script>
/* =================== Dates =================== */
const pad2 = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const todayYMD = () => ymd(new Date());
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/864e5);
const addDays = (s,n) => { const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmtDate = s => parseYmd(s).toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
const fmtShort = s => parseYmd(s).toLocaleDateString(undefined,{day:'numeric', month:'short'});
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* =================== State & storage =================== */
const LS_KEY='glute-plan-v1';
const blankProfile = () => ({start:null, unit:'kg', round:1, checkins:[]});
let S = {profile:blankProfile(), sessions:{}};
const store = {mode:'pending', col:null, synced:false};
const dirty = new Set(); let flushing=false, flushTimer=0, retries={};

function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return; const o=JSON.parse(raw);
    if(o && o.profile){ S.profile=Object.assign(blankProfile(), o.profile); S.sessions=o.sessions||{}; } }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function hasLocalData(){ return Object.keys(S.sessions).length>0 || S.profile.checkins.length>0 || !!S.profile.start; }
function touch(id){ dirty.add(id); saveLocal(); clearTimeout(flushTimer); flushTimer=setTimeout(flush, 600); }
async function flush(){
  if(store.mode!=='cloud' || !store.synced || flushing) return;
  flushing=true;
  try{
    while(dirty.size){
      const id=dirty.values().next().value; dirty.delete(id);
      const body = id==='profile' ? S.profile : S.sessions[id];
      try{
        if(body) await store.col.doc(id).set(JSON.parse(JSON.stringify(body)));
        else await store.col.doc(id).delete();
        delete retries[id];
      }catch(e){
        const code = e && e.code;
        if(code==='unavailable' && (retries[id]||0) < 2){ retries[id]=(retries[id]||0)+1; dirty.add(id); await sleep(700+Math.random()*900); }
        else if(code==='quota_exceeded'){ toast('Your log is full. Erase old data in Guide → Settings.'); }
        else { goLocal('Could not save to your account. Saving on this phone instead.'); return; }
      }
    }
  } finally { flushing=false; }
}
function applyRemote(r){
  const before=JSON.stringify(S);
  if(r.profile && !dirty.has('profile')) S.profile=Object.assign(blankProfile(), r.profile);
  for(const id in r.sessions) if(!dirty.has(id)) S.sessions[id]=r.sessions[id];
  for(const id of Object.keys(S.sessions)) if(!(id in r.sessions) && !dirty.has(id)) delete S.sessions[id];
  saveLocal();
  return JSON.stringify(S)!==before;
}
function parseSnap(snap){
  const r={profile:null, sessions:{}};
  snap.docs.forEach(d=>{ const b=JSON.parse(JSON.stringify(d.data()||{})); if(d.id==='profile') r.profile=b; else if(/^s\d+-d\d+$/.test(d.id)) r.sessions[d.id]=b; });
  return r;
}
function onSnap(snap){
  if(snap.metadata.hasPendingWrites) return;
  const r=parseSnap(snap);
  if(!store.synced){
    if(snap.metadata.fromCache){ if(!snap.empty && applyRemote(r)) requestRender(); return; }
    store.synced=true;
    if(snap.empty){ if(hasLocalData()){ dirty.add('profile'); Object.keys(S.sessions).forEach(id=>dirty.add(id)); } ensureStart(); flush(); }
    else { applyRemote(r); ensureStart(); }
    render(); return;
  }
  if(applyRemote(r)) requestRender();
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') throw 0;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) throw 0;
    const uid = await user.id(); if(!uid) throw 0;
    store.col = db.collection('data/users/'+uid); store.mode='cloud';
    store.col.onSnapshot(onSnap, ()=>goLocal());
  }catch(e){ goLocal(); }
}
function goLocal(msg){ const was=store.mode; store.mode='local'; store.synced=true; ensureStart(); if(msg && was==='cloud') toast(msg); render(); }
function ensureStart(){ if(!S.profile.start){ S.profile.start=todayYMD(); touch('profile'); } }

let pendingRender=false;
function requestRender(){
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='SELECT')){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout', ()=>{ if(pendingRender){ setTimeout(()=>{ const a=document.activeElement; if(!(a && (a.tagName==='INPUT'||a.tagName==='SELECT'))){ pendingRender=false; render(); } }, 50); } });

/* =================== Program helpers =================== */
const startDate = () => S.profile.start || todayYMD();
const todayIdx = () => daysBetween(startDate(), todayYMD()) + 1;
const dateOfDay = n => addDays(startDate(), n-1);

const sessKey = n => `s${S.profile.round||1}-d${n}`;
function getSess(n, create){ const k=sessKey(n); if(!S.sessions[k] && create) S.sessions[k]={day:n, round:S.profile.round||1, log:{}, done:false}; return S.sessions[k]; }
function setsDone(se, id){ return se && se.log && se.log[id] ? se.log[id].filter(s=>s.d).length : 0; }
function lastPerf(id, n){
  const cur=sessKey(n); let best=null;
  for(const k in S.sessions){
    if(k===cur) continue; const se=S.sessions[k]; const arr=se.log && se.log[id]; if(!arr) continue;
    const sets=arr.filter(s=>s.d); if(!sets.length) continue;
    const when=(se.finished||se.date||'')+'|'+pad2(se.round||1)+pad2(se.day||0);
    if(!best || when>best.when) best={when, sets, se};
  }
  return best;
}
function unitW(){ return S.profile.unit==='lb' ? 'lb' : 'kg'; }
function unitL(){ return S.profile.unit==='lb' ? 'in' : 'cm'; }
function perfText(sets, mode){
  const u=unitW();
  if(mode==='wr'){ const ws=[...new Set(sets.map(s=>s.w))]; if(ws.length===1 && ws[0]!=null && ws[0]!=='') return `${ws[0]} ${u} × ${sets.map(s=>s.r??'–').join(', ')}`; return sets.map(s=>`${s.w??0}×${s.r??'–'}`).join(', '); }
  if(mode==='r') return sets.map(s=>s.r??'–').join(', ') + ' reps';
  if(mode==='t') return sets.map(s=>s.s??'–').join(', ') + ' s';
  if(mode==='wt') return `${sets[0].w??0} ${u} × ${sets.map(s=>s.s??'–').join(', ')} s`;
  if(mode==='min') return `${sets[0].m??'–'} min`;
  return 'Done';
}
function streak(){
  const dates=new Set(Object.values(S.sessions).filter(s=>s.done && s.finished).map(s=>s.finished));
  let d=todayYMD(); if(!dates.has(d)) d=addDays(d,-1); let n=0;
  while(dates.has(d)){ n++; d=addDays(d,-1); }
  return n;
}
function checkinDue(){ const c=S.profile.checkins; if(!c.length) return true; const last=c[c.length-1].d; return daysBetween(last, todayYMD())>=7; }

/* =================== UI state =================== */
const ui = {tab:'today', viewDay:null, sheet:null, confirm:null};
let player=null;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =================== Header =================== */
function renderHeader(){
  const ti=todayIdx(), cur=Math.min(56, Math.max(0, ti));

  }

}

/* =================== Today =================== */
function viewToday(){
  const ti=todayIdx();
  if(ti>56 && !ui.viewDay) return viewComplete();

  const info=dayInfo(n), ph=PHASES[info.phase], tpl=info.tpl, se=getSess(n);

  if(ti<1) h += `<div class="notice" style="margin-bottom:12px">Your plan starts on ${esc(fmtDate(startDate()))}. Here is Day 1 so you can look ahead.</div>`;
  if(ui.viewDay && ui.viewDay!==ti) h += `<div class="viewing"><span>Viewing Day ${n} · ${esc(fmtDate(dateOfDay(n)))}</span><button class="btn small" data-act="today">Back to today</button></div>`;

    <p class="effort">${esc(ph.effort)}</p>

      <span class="dots">${dots}</span></button>`;
  });

  const total=tpl.items.reduce((a,[id,kind])=>a+presc(kind,info.phase,id).sets,0);
  const doneAll=tpl.items.reduce((a,[id])=>a+Math.min(setsDone(se,id), 99),0);

  if(se && se.done) h += `<div class="done-banner"><span><strong>Workout done</strong><br><span class="muted">${esc(fmtDate(se.finished||todayYMD()))} · ${doneAll} sets</span></span><button class="btn small ghost" data-act="unfinish">Undo</button></div>`;
  else h += `<button class="btn primary block" data-act="finish" data-day="${n}">Finish workout · ${doneAll}/${total} sets</button>`;
  h += '</div>';

}
function viewComplete(){
  const done=Object.values(S.sessions).filter(s=>s.done && (s.round||1)===(S.profile.round||1)).length;
  return `<div class="hero"><div class="eyebrow">Round ${S.profile.round||1} finished</div><h1 class="display">8 weeks done</h1>

/* =================== Exercise sheet =================== */

const ICON_BACK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';

const ICON_TICK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function renderSheet(){
  const c=sheetCtx(), ex=EX[c.id], el=document.getElementById('sheet');

    <a class="btn block yt" href="${yt}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.7 2.7 0 0 0-1.9-1.9C18 4.8 12 4.8 12 4.8s-6 0-7.7.5a2.7 2.7 0 0 0-1.9 1.9C2 8.9 2 12 2 12s0 3.1.4 4.8a2.7 2.7 0 0 0 1.9 1.9c1.7.5 7.7.5 7.7.5s6 0 7.7-.5a2.7 2.7 0 0 0 1.9-1.9c.4-1.7.4-4.8.4-4.8s0-3.1-.4-4.8zM10 15.1V8.9l5.2 3.1z"/></svg>Watch form videos on YouTube</a>
    <div class="howto">

  el.innerHTML = h;

function logHtml(c){

      : `<div class="tip">Last time: ${esc(perfText(last.sets,'wr'))}. Match it, then try to beat it by one rep.</div>`;

      if(k==='s') return pr.unit==='sec' ? pr.target : (ls && ls.s ? ls.s : '');

function makePlayer(svg, ex){
  const tl=timeline(ex); let raf=0, last=0, elapsed=0.0, paused=reduceMotion, speed=1;
  const draw = () => { svg.innerHTML = renderScene(ex, poseAt(ex, tl, elapsed)); };
  const loop = ts => { if(!last) last=ts; const dt=Math.min(0.1,(ts-last)/1000); last=ts; elapsed+=dt*speed; draw(); raf=requestAnimationFrame(loop); };
  return {
    start(){ cancelAnimationFrame(raf); paused=false; last=0; raf=requestAnimationFrame(loop); },
    stop(){ cancelAnimationFrame(raf); raf=0; },
    toggle(){ if(paused){ this.start(); } else { this.stop(); paused=true; } return paused; },
    get paused(){ return paused; },
    slow(on){ speed = on ? 0.45 : 1; },
    drawStatic(){ const p=staticPose(ex); svg.innerHTML=renderScene(ex,p); }
  };
}

const rest={end:0,total:0,iv:0,hideT:0};
let actx=null;
function ensureAudio(){ try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){ try{ if(!actx) return; const t=actx.currentTime; [0,0.22].forEach(o=>{ const os=actx.createOscillator(), g=actx.createGain(); os.frequency.value=880; g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.25,t+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.16); os.connect(g).connect(actx.destination); os.start(t+o); os.stop(t+o+0.18); }); }catch(e){} }
function startRest(sec){
  ensureAudio(); clearInterval(rest.iv); clearTimeout(rest.hideT);
  rest.total=sec; rest.end=Date.now()+sec*1000;
  const el=document.getElementById('rest'); el.classList.remove('go'); el.hidden=false;
  el.innerHTML=`<i class="rb"></i><span class="rl">Rest</span><span class="rt" id="rt">0:00</span><span class="sp"></span><button data-act="rest-add">+15 s</button><button data-act="rest-skip">Skip</button>`;
  tickRest(); rest.iv=setInterval(tickRest, 250);
}
function tickRest(){
  const el=document.getElementById('rest'); const left=Math.max(0,(rest.end-Date.now())/1000); const s=Math.ceil(left);
  const rt=document.getElementById('rt'); if(rt) rt.textContent=`${Math.floor(s/60)}:${pad2(s%60)}`;
  el.style.setProperty('--p', (rest.total? left/rest.total*100 : 0)+'%');
  if(left<=0){ clearInterval(rest.iv); beep(); try{ navigator.vibrate && navigator.vibrate([180,80,180]); }catch(e){}
    el.classList.add('go'); el.innerHTML='<span class="rt">Go</span><span class="sp"></span><span class="rl">Next set</span><button data-act="rest-skip">Close</button>';
    rest.hideT=setTimeout(()=>{ el.hidden=true; }, 4000); }
}
function stopRest(){ clearInterval(rest.iv); clearTimeout(rest.hideT); document.getElementById('rest').hidden=true; }
let wake=null;
async function requestWake(){ try{ if('wakeLock' in navigator && !wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } }catch(e){ wake=null; } }

function lineChart(pts, unit){
  if(pts.length<2) return `<p class="empty">Log at least two check-ins to see a trend.</p>`;
  const W=320, Hh=120, L=34, R=10, T=10, B=22;
  const ys=pts.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys); if(hi-lo<1){ lo-=1; hi+=1; } const padv=(hi-lo)*0.15; lo-=padv; hi+=padv;
  const t0=parseYmd(pts[0].x).getTime(), t1=parseYmd(pts[pts.length-1].x).getTime(); const span=Math.max(1,t1-t0);
  const X=x=>L+(parseYmd(x).getTime()-t0)/span*(W-L-R), Y=y=>T+(hi-y)/(hi-lo)*(Hh-T-B);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Trend chart">`;
  for(let i=0;i<3;i++){ const v=lo+(hi-lo)*(i/2); s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text class="ax" x="${L-6}" y="${f1(Y(v)+3)}" text-anchor="end">${(Math.round(v*10)/10)}</text>`; }
  const path=pts.map((p,i)=>`${i?'L':'M'}${f1(X(p.x))},${f1(Y(p.y))}`).join('');
  s += `<path class="ar" d="${path}L${f1(X(pts[pts.length-1].x))},${Hh-B}L${f1(X(pts[0].x))},${Hh-B}Z"/><path class="ln" d="${path}"/>`;
  pts.forEach((p,i)=>{ s+=`<circle class="pt${i===pts.length-1?' end':''}" cx="${f1(X(p.x))}" cy="${f1(Y(p.y))}" r="3.4"/>`; });
  s += `<text class="ax" x="${L}" y="${Hh-6}">${esc(fmtShort(pts[0].x))}</text><text class="ax" x="${W-R}" y="${Hh-6}" text-anchor="end">${esc(fmtShort(pts[pts.length-1].x))}</text></svg>`;
  return s;
}
function spark(vals){
  if(vals.length<2) return '';
  const W=92,H=30,lo=Math.min(...vals),hi=Math.max(...vals),r=(hi-lo)||1;
  const X=i=>3+i/(vals.length-1)*(W-6), Y=v=>H-4-(v-lo)/r*(H-8);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="ln" d="${vals.map((v,i)=>`${i?'L':'M'}${f1(X(i))},${f1(Y(v))}`).join('')}"/><circle class="pt" cx="${f1(X(vals.length-1))}" cy="${f1(Y(vals[vals.length-1]))}" r="2.6"/></svg>`;
}

    <p class="muted" style="font-size:12.5px">Changing units does not convert numbers you have already logged.</p>
    <p class="os">Backup</p>
    <p class="muted" style="font-size:12.5px">Copy the code and keep it somewhere safe, like Notes. Paste it here on a new phone to bring your whole log across.</p>
    <button class="btn block" data-act="backup">Copy backup code</button>
    <textarea id="restore-box" class="restore" placeholder="Paste a backup code here" aria-label="Backup code"></textarea>
    <button class="btn block" data-act="restore">${ui.confirm==='restore'?'Tap again to replace this phone\u2019s log':'Restore from code'}</button>
    <p class="os">Plan</p>
    <button class="btn block" data-act="restart">${ui.confirm==='restart'?'Tap again to restart from today':'Restart the plan from today'}</button>
    <button class="btn block danger" data-act="erase">${ui.confirm==='erase'?'Tap again to erase everything':'Erase all my data'}</button>
  </div></details>`;
}

/* =================== Render & events =================== */
function render(){
  renderHeader();
  const v=document.getElementById('view');
  const fn={today:viewToday, plan:viewPlan, moves:viewMoves, progress:viewProgress, guide:viewGuide}[ui.tab];
  const openDetails=[...v.querySelectorAll('details.g')].map(d=>d.open);
  v.innerHTML=fn();
  if(ui.tab==='guide' && openDetails.length) v.querySelectorAll('details.g').forEach((d,i)=>{ if(openDetails[i]!=null) d.open=openDetails[i]; });
  document.querySelectorAll('.tab').forEach(b=>{ if(b.dataset.tab===ui.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(ui.sheet && ui.sheet.day) refreshLog();
}
function setTab(t){ ui.tab=t; ui.confirm=null; if(t!=='today') ui.viewDay=null; render(); window.scrollTo(0,0); }
function armConfirm(key){ ui.confirm=key; render(); clearTimeout(armConfirm.t); armConfirm.t=setTimeout(()=>{ if(ui.confirm===key){ ui.confirm=null; render(); } }, 4000); }

function readRowInputs(i){
  const o={}; document.querySelectorAll(`#sheet-log [data-i="${i}"][data-field]`).forEach(inp=>{ o[inp.dataset.field]={v:inp.value, ph:inp.placeholder}; }); return o;
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  switch(act){
    case 'tab': setTab(b.dataset.tab); break;
    case 'today': ui.viewDay=null; render(); window.scrollTo(0,0); break;
    case 'view-day': { const n=+b.dataset.day; ui.viewDay = n===todayIdx() ? null : n; if(ui.tab!=='today'){ ui.tab='today'; } render(); window.scrollTo(0,0); break; }
    case 'open-ex': openSheet(b.dataset.ex, b.dataset.day ? +b.dataset.day : null); break;
    case 'close-sheet': closeSheet(); break;
    case 'sheet-step': { const c=sheetCtx(); const ni=c.idx + (+b.dataset.dir); if(c.items && c.items[ni]){ ui.sheet.ex=c.items[ni][0]; renderSheet(); document.getElementById('sheet').scrollTop=0; } break; }
    case 'anim-toggle': if(player){ const p=player.toggle(); b.textContent = p ? 'Play' : 'Pause'; } break;
    case 'anim-slow': { const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed', on); if(player) player.slow(on); break; }
    case 'tick': {
      const c=sheetCtx(), i=+b.dataset.i, se=getSess(c.day,true); const arr=se.log[c.id] || (se.log[c.id]=[]);
      while(arr.length<=i) arr.push({});
      const s=arr[i];
      if(!s.d){
        const vals=readRowInputs(i);
        for(const k in vals){ const raw = vals[k].v!=='' ? vals[k].v : vals[k].ph; if(raw!=='' && raw!=null) s[k]=+raw; }
        s.d=true; const pr=presc(c.kind, c.info.phase, c.id); if(pr.rest>=30) startRest(pr.rest); else ensureAudio();
      } else s.d=false;
      if(!se.date) se.date=todayYMD();
      touch(sessKey(c.day)); refreshLog(); renderHeader();
      break; }
    case 'add-set': { const c=sheetCtx(), se=getSess(c.day,true), pr=presc(c.kind,c.info.phase,c.id); const arr=se.log[c.id]||(se.log[c.id]=[]); while(arr.length<pr.sets) arr.push({}); arr.push({}); touch(sessKey(c.day)); refreshLog(); break; }
    case 'remove-set': { const c=sheetCtx(), se=getSess(c.day), pr=presc(c.kind,c.info.phase,c.id); if(se && se.log[c.id] && se.log[c.id].length>pr.sets){ se.log[c.id].pop(); touch(sessKey(c.day)); refreshLog(); } break; }
    case 'finish': { const n=+b.dataset.day, se=getSess(n,true); se.done=true; se.finished=todayYMD(); if(!se.date) se.date=se.finished; touch(sessKey(n)); stopRest(); render(); window.scrollTo(0,0); toast('Workout saved. Nice work.'); break; }
    case 'unfinish': { const n=ui.viewDay || Math.max(1,Math.min(56,todayIdx())); const se=getSess(n); if(se){ se.done=false; delete se.finished; touch(sessKey(n)); render(); } break; }
    case 'rest-skip': stopRest(); break;
    case 'rest-add': rest.end+=15000; rest.total+=15; tickRest(); break;
    case 'goto-checkin': setTab('progress'); setTimeout(()=>{ const el=document.getElementById('checkin'); if(el) el.scrollIntoView({behavior: reduceMotion?'auto':'smooth'}); const i=document.getElementById('ci-wt'); if(i) i.focus({preventScroll:true}); }, 30); break;
    case 'checkin-save': {
      const g=id=>{ const v=document.getElementById(id).value; return v===''?null:+v; };
      const entry={d:todayYMD(), wt:g('ci-wt'), waist:g('ci-waist'), hips:g('ci-hips')};
      if(entry.wt==null && entry.waist==null && entry.hips==null){ toast('Enter at least one measurement.'); break; }
      const c=S.profile.checkins, idx=c.findIndex(x=>x.d===entry.d);
      if(idx>=0) c[idx]=Object.assign({}, c[idx], Object.fromEntries(Object.entries(entry).filter(([k,v])=>v!=null))); else c.push(entry);
      c.sort((a,b)=>a.d.localeCompare(b.d));
      touch('profile'); render(); toast('Check-in saved.'); break; }
    case 'restart': {
      if(ui.confirm!=='restart'){ armConfirm('restart'); break; }
      ui.confirm=null; const hasAny=Object.values(S.sessions).some(s=>(s.round||1)===(S.profile.round||1));
      if(hasAny) S.profile.round=(S.profile.round||1)+1;
      S.profile.start=todayYMD(); ui.viewDay=null; touch('profile'); ui.tab='today'; render(); toast('Plan restarted. Today is Day 1.'); break; }
    case 'backup': {
      const code='GP1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const box=document.getElementById('restore-box');
      const fallback=()=>{ if(box){ box.value=code; box.focus(); box.select(); } toast('Select the code in the box and copy it.'); };
      try{ navigator.clipboard.writeText(code).then(()=>toast('Backup copied. Paste it into Notes to keep it safe.'), fallback); }catch(err){ fallback(); }
      break; }
    case 'restore': {
      const box=document.getElementById('restore-box'); const raw=(box && box.value || '').trim();
      let data=null;
      try{ data=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/^GP1:/,''))))); }catch(err){ data=null; }
      if(!data || !data.profile){ toast('That code did not work. Copy the whole code and try again.'); break; }
      if(ui.confirm!=='restore'){ armConfirm('restore'); setTimeout(()=>{ const b2=document.getElementById('restore-box'); if(b2) b2.value=raw; },0); break; }
      ui.confirm=null; S={profile:Object.assign(blankProfile(), data.profile), sessions:data.sessions||{}}; saveLocal(); ui.viewDay=null; ui.tab='today'; render(); toast('Log restored.'); break; }
    case 'erase': {
      if(ui.confirm!=='erase'){ armConfirm('erase'); break; }
      ui.confirm=null; Object.keys(S.sessions).forEach(id=>{ delete S.sessions[id]; dirty.add(id); });
      S.profile=blankProfile(); S.profile.start=todayYMD(); touch('profile'); ui.viewDay=null; ui.tab='today'; render(); toast('All data erased.'); break; }
  }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset && t.dataset.field && ui.sheet && ui.sheet.day){
    const c=sheetCtx(), i=+t.dataset.i, se=getSess(c.day,true); const arr=se.log[c.id]||(se.log[c.id]=[]);
    while(arr.length<=i) arr.push({});
    if(t.value==='') delete arr[i][t.dataset.field]; else arr[i][t.dataset.field]=+t.value;
    if(!se.date) se.date=todayYMD(); touch(sessKey(c.day));
  } else if(t.id==='set-start' && t.value){ S.profile.start=t.value; ui.viewDay=null; touch('profile'); render(); toast('Start date updated.'); }
  else if(t.id==='set-unit'){ S.profile.unit=t.value; touch('profile'); render(); }
});
document.addEventListener('input', e=>{ if(e.target.id==='move-search') filterMoves(e.target.value); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ui.sheet) closeSheet(); });

/* =================== Boot =================== */
loadLocal();
store.mode='local'; store.synced=true; ensureStart();
render();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
